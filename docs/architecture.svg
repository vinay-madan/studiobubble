<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>StudioBubble architecture</title>
  <desc>Screen, camera, and microphone capture flow through a canvas compositor and MediaPipe virtual background model into a WebCodecs/mediabunny encoder, then a crash-safe OPFS writer, then either a chosen folder or browser storage, then the library and review/export screens.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0b2e"/>
      <stop offset="55%" stop-color="#120e24"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>

    <linearGradient id="inputGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#4f8bff"/>
    </linearGradient>
    <linearGradient id="camGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="micGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="compGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="encGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="storeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="destGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="destGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="libGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="revGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1200" height="760" rx="28" fill="url(#bgGrad)"/>
  <circle cx="120" cy="90" r="220" fill="#7c5cff" opacity="0.08"/>
  <circle cx="1080" cy="680" r="260" fill="#db2777" opacity="0.08"/>

  <!-- header -->
  <text x="60" y="64" fill="#ffffff" font-size="30" font-weight="700">StudioBubble</text>
  <text x="60" y="90" fill="#9aa0c0" font-size="15">Recording pipeline — everything runs client-side, in the browser tab</text>

  <!-- edge style -->
  <g stroke="#4b4f6b" stroke-width="2.5" fill="none" opacity="0.9">
    <path d="M175,190 L175,240 L370,240" marker-end="url(#arrow)"/>
    <path d="M540,190 L540,232" marker-end="url(#arrow)"/>
    <path d="M905,190 L905,232" marker-end="url(#arrow)"/>
    <path d="M175,190 Q175,300 300,340" marker-end="url(#arrow)"/>
    <path d="M540,292 L540,340" marker-end="url(#arrow)"/>
    <path d="M905,292 L905,335 Q905,375 760,410" marker-end="url(#arrow)"/>
    <path d="M540,410 L540,452" marker-end="url(#arrow)"/>
    <path d="M540,512 L540,552" marker-end="url(#arrow)"/>
    <path d="M470,612 L370,652" marker-end="url(#arrow)"/>
    <path d="M610,612 L730,652" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8fb0"/>
    </marker>
  </defs>

  <!-- Row 1: inputs -->
  <g filter="url(#softShadow)">
    <rect x="60" y="126" width="230" height="64" rx="16" fill="url(#inputGrad)"/>
    <rect x="425" y="126" width="230" height="64" rx="16" fill="url(#camGrad)"/>
    <rect x="790" y="126" width="230" height="64" rx="16" fill="url(#micGrad)"/>
  </g>
  <text x="175" y="153" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Screen capture</text>
  <text x="175" y="173" fill="#f1f0ff" font-size="11" text-anchor="middle" opacity="0.9">getDisplayMedia</text>
  <text x="540" y="153" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Camera capture</text>
  <text x="540" y="173" fill="#fce7f3" font-size="11" text-anchor="middle" opacity="0.9">getUserMedia</text>
  <text x="905" y="153" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Microphone</text>
  <text x="905" y="173" fill="#ecfeff" font-size="11" text-anchor="middle" opacity="0.9">getUserMedia</text>

  <!-- Row 2: per-source processing -->
  <g filter="url(#softShadow)">
    <rect x="370" y="232" width="220" height="60" rx="14" fill="#1c1836" stroke="url(#camGrad)" stroke-width="2"/>
    <rect x="790" y="232" width="230" height="60" rx="14" fill="#12222a" stroke="url(#micGrad)" stroke-width="2"/>
  </g>
  <text x="480" y="256" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Virtual background</text>
  <text x="480" y="275" fill="#e9d5ff" font-size="10.5" text-anchor="middle">MediaPipe segmentation</text>
  <text x="905" y="256" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Audio mixer</text>
  <text x="905" y="275" fill="#cffafe" font-size="10.5" text-anchor="middle">Web Audio graph</text>

  <!-- Row 3: compositor -->
  <g filter="url(#glow)">
    <rect x="290" y="340" width="500" height="70" rx="18" fill="url(#compGrad)"/>
  </g>
  <text x="540" y="368" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">Compositor</text>
  <text x="540" y="390" fill="#f5e9ff" font-size="12" text-anchor="middle">canvas · bubble · zoom/spotlight · backdrop</text>

  <!-- Row 4: encoder -->
  <g filter="url(#glow)">
    <rect x="190" y="452" width="700" height="60" rx="16" fill="url(#encGrad)"/>
  </g>
  <text x="540" y="478" fill="#1a1200" font-size="16" font-weight="800" text-anchor="middle">Encode &amp; mux</text>
  <text x="540" y="497" fill="#3a2600" font-size="11.5" text-anchor="middle">WebCodecs via mediabunny</text>

  <!-- Row 5: OPFS writer -->
  <g filter="url(#glow)">
    <rect x="290" y="552" width="500" height="60" rx="16" fill="url(#storeGrad)"/>
  </g>
  <text x="540" y="578" fill="#04220f" font-size="15" font-weight="800" text-anchor="middle">OPFS crash-safe writer</text>
  <text x="540" y="597" fill="#053d1c" font-size="11" text-anchor="middle">sync access handle, flushed every ~2s</text>

  <!-- Row 6: destinations -->
  <g filter="url(#softShadow)">
    <rect x="190" y="652" width="260" height="60" rx="14" fill="url(#destGrad1)"/>
    <rect x="630" y="652" width="260" height="60" rx="14" fill="url(#destGrad2)"/>
  </g>
  <text x="320" y="678" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Your chosen folder</text>
  <text x="320" y="697" fill="#dbeafe" font-size="10.5" text-anchor="middle">File System Access, on stop</text>
  <text x="760" y="678" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Browser storage</text>
  <text x="760" y="697" fill="#cffafe" font-size="10.5" text-anchor="middle">OPFS, if no folder chosen</text>

  <text x="600" y="742" fill="#7d81a3" font-size="12" text-anchor="middle">No servers · no uploads · no telemetry — everything above runs on your device</text>
</svg>

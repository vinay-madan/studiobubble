[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  # Required for OPFS / SharedArrayBuffer-adjacent APIs to behave consistently across browsers.
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

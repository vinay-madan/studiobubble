name: Release desktop app

# Push a tag like v0.3.0 to build installers for Windows, macOS, and Linux and attach them
# to a GitHub Release. Each OS builds natively (electron-builder can't reliably cross-build
# a .dmg from Linux/Windows, or vice versa) via a matrix job.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # electron-builder builds the web app (npm run build) then packages + publishes to
      # the GitHub Release matching this tag, using GH_TOKEN for API access.
      - run: npm run electron:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

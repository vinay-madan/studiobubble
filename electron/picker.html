<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Choose what to share</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
        background: #14151c;
        color: #f4f5f7;
        padding: 16px;
      }
      h1 { font-size: 14px; font-weight: 600; margin: 0 0 12px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
        max-height: 320px;
        overflow-y: auto;
      }
      .card {
        border: 1px solid #2a2e3a;
        background: #1b1e27;
        border-radius: 10px;
        padding: 8px;
        cursor: pointer;
        text-align: center;
      }
      .card:hover { border-color: #7c5cff; }
      .card img {
        width: 100%;
        height: 80px;
        object-fit: contain;
        background: #000;
        border-radius: 6px;
        display: block;
      }
      .card span {
        display: block;
        margin-top: 6px;
        font-size: 11px;
        color: #cfd1e0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .actions { margin-top: 14px; text-align: right; }
      button {
        background: transparent;
        border: 1px solid #2a2e3a;
        color: #f4f5f7;
        border-radius: 8px;
        padding: 8px 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Choose a screen or window to record</h1>
    <div class="grid" id="grid"></div>
    <div class="actions">
      <button id="cancel">Cancel</button>
    </div>
    <script>
      const grid = document.getElementById('grid');
      window.picker.onSources((sources) => {
        grid.innerHTML = '';
        for (const s of sources) {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `<img src="${s.thumbnail}" alt="" /><span>${s.name}</span>`;
          card.onclick = () => window.picker.choose(s.id);
          grid.appendChild(card);
        }
      });
      document.getElementById('cancel').onclick = () => window.picker.cancel();
    </script>
  </body>
</html>
